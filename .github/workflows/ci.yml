name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Comprobar que no hay datos reales versionados
        run: |
          allowed='^fixtures/tenant-(origen|destino)\.csv$'
          tracked=$(git ls-files | grep -Ei '\.(csv|json|xlsx|xls|xlsm)$' | grep -vE "$allowed" || true)
          historical=$(git log --all --name-only --pretty=format: | grep -Ei '\.(csv|json|xlsx|xls|xlsm)$' | grep -vE "$allowed" | sort -u || true)
          reports=$(git ls-files | grep -E '(^|/)report\.(html|json)$' || true)
          if [ -n "$tracked" ] || [ -n "$historical" ] || [ -n "$reports" ]; then
            echo "Hay ficheros de datos o informes no permitidos:" >&2
            printf '%s\n%s\n%s\n' "$tracked" "$historical" "$reports" >&2
            exit 1
          fi
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Revisar estilo
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Ejecutar tests
        run: pytest --cov-fail-under=85
      - name: Probar la demo
        run: gam-policy-diff --demo --out /tmp/report.html
