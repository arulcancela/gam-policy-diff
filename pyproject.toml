[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gam-policy-diff"
dynamic = ["version"]
description = "Compara políticas de Google Workspace exportadas con GAM y genera un informe por impacto"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raúl Cancela" }]
keywords = ["google-workspace", "gam", "migration", "policies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
gam-policy-diff = "gam_policy_diff.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gam_policy_diff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=gam_policy_diff --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gam_policy_diff"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
